version: 2
updates:
  # 依赖周更：minor/patch 合并成一条 PR 降噪，major 单独出 PR（由 dependabot-fix.yml 验证修复）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # conventional 前缀，release-propose 能正确归类为 chore（不会虚推发版档位）
    commit-message:
      prefix: chore
      prefix-development: chore

  # 本仓库自用的 GitHub Actions 版本更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
