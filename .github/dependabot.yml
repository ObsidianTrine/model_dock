version: 2
updates:
  # 依赖周更（周六）：minor/patch 合并成一条 PR 降噪，major 单独出 PR（由 dependabot-fix.yml 验证修复）
  # time 仅为当天内意向提示：Dependabot 按平台负载排队，不保证精确时刻
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # @types/node 只跟随 engines 的最低支持线（node>=22 → types 22.x 线）：major 往往对准尚未
    # 发布的 node 新主线，类型面先行会破坏当前编译（#22 实证 types 26 触发 TS2694）
    ignore:
      - dependency-name: "@types/node"
        versions:
          - "version-update:semver-major"
    # conventional 前缀，release-propose 能正确归类为 chore（不会虚推发版档位）
    commit-message:
      prefix: chore
      prefix-development: chore

  # 本仓库自用的 GitHub Actions 版本更新（同为周六）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      actions:
        patterns:
          - "*"
