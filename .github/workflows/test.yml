name: test

on:
  push:
    branches: [main, develop]
  pull_request:
  # 每日巡检（全矩阵含 mac 腿 + 工作流套件）：兜底捕捉 CI 环境漂移与 mac 专属回归——
  # mac 腿已退出 develop push 矩阵（见 test job 的 if），不巡检就没人盯它了。
  # 注意：schedule 只认默认分支（main）上的 workflow 文件，本文件合入 main 后才生效。
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 北京时间次日 02:00
  # 供 ci-autofix 给修复分支补发检查用：autofix PR 由 GITHUB_TOKEN 开出，平台不为它触发
  # push/pull_request 事件（见 ci-autofix.yml 头注），收尾步骤用 workflow_dispatch 显式跑一条
  workflow_dispatch:

permissions:
  contents: read

# 同分支新推送自动取消旧运行，省排队时间
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 只测 node 24（SEA 捆绑的运行时大版本）；engines 声明 >=22，22 不在 CI 覆盖内
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, node${{ matrix.node }})
    # mac 腿分级（2026-11-03）：只在 PR / push main（发布门禁）/ 每日巡检 / 手动时运行，
    # develop push 不跑。依据：macos arm64 hosted runner 排队严重（v1.5.0 曾连挂 7 次、
    # 2026-11-02 一次 run 排队 8h15m 才起跑），是 CI 最大的时间浪费源；而开发机就是 mac，
    # develop 高频直推上 mac 腿是重复支付。required check 不受影响：PR 上 mac 腿照常报告。
    # ⚠ 条件必须写在 step 级：job 级 if 没有 matrix 上下文（GitHub 解析直接拒绝整个
    # workflow——push 静默不跑、dispatch 报 422，2026-11-03 v1.6.0 发布门禁实测踩中，
    # d774182 上 check-runs 为 0）。拆独立 job 会改 check 名破坏 required check，不可取。
    # 正常全程 1~5 分钟；卡死（曾出现 Linux 上 vitest 收尾悬挂）20 分钟内强制失败，
    # 而不是悬死 6 小时。配合下方 always() 诊断步骤留下进程现场。
    timeout-minutes: 20
    # step 级分级（= 非(mac && push && 非main)）：develop push 上 mac 腿只付 checkout + 占位
    steps:
      - uses: actions/checkout@v7
      - name: mac 腿占位（develop push 分级跳过，PR / push main / 巡检 / 手动才真跑）
        if: matrix.os == 'macos-latest' && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: echo 'mac 腿按触发分级跳过（见 job 头注）；占位保 required check 报告'
      - uses: actions/setup-node@v7
        if: matrix.os != 'macos-latest' || github.event_name != 'push' || github.ref == 'refs/heads/main'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --no-audit --no-fund：CI 审计门禁由 release-check 的 npm audit --omit=dev 承担，这里不重复付安装耗时
      - run: npm ci --no-audit --no-fund
        if: matrix.os != 'macos-latest' || github.event_name != 'push' || github.ref == 'refs/heads/main'
      # noEmit：类型门禁；产物由发布链生成（build-sea.mjs 自带 tsc emit），本 job 无人消费
      - run: npx tsc -p tsconfig.json --noEmit
        if: matrix.os != 'macos-latest' || github.event_name != 'push' || github.ref == 'refs/heads/main'
      - run: npm test
        if: matrix.os != 'macos-latest' || github.event_name != 'push' || github.ref == 'refs/heads/main'
      # 文件权限断言在 NTFS 上做平台分支（见 AGENTS.md），Windows 跑同一套测试验证跨平台行为
      # 悬死排查调试模式：正常不需要。再出现测试悬死时，把上一行临时改为
      #   VITEST_WATCHDOG=1 npm test
      # 日志会出现 [FILE-START/DONE]（卡点文件）+ 每 10s [WATCHDOG]（worker 的
      # state/wchan/CPU 时钟 + 心跳），判读指南见 test/vitest-watchdog.mjs 顶部。
      # 测试被杀/失败时留下进程与端口现场：卡死排查不用再猜。注意 job 超时的结论是
      # canceled 而非 failure——条件必须带 cancelled()，否则超时被杀时本步骤不会执行。
      - name: 诊断现场（测试失败或超时后）
        if: (failure() || cancelled()) && runner.os == 'Linux'
        run: |
          echo "=== 心跳日志尾部（worker 活性） ==="
          tail -40 /tmp/vitest-heartbeat.log 2>/dev/null || echo "（无心跳文件）"
          echo "=== 残留进程（node/vitest/git） ==="
          ps -ef | grep -E "node|vitest|git" | grep -v grep || true
          echo "=== 各 node 进程内核等待通道与 CPU 时钟 ==="
          for p in $(pgrep node 2>/dev/null); do
            echo "pid=$p state=$(awk '{print $3}' /proc/$p/stat 2>/dev/null) wchan=$(cat /proc/$p/wchan 2>/dev/null) cmd=$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | cut -c1-90)"
          done
          echo "=== 监听端口 ==="
          ss -ltnp || true
          echo "=== /tmp 测试目录残留 ==="
          ls -d /tmp/modeldock-test-* /tmp/orch-test-* 2>/dev/null | head -20 || true

  # agent 工作流套件（.agents/ 编排器脚本与分支守卫 hook）：与产品测试拆分（npm test 只跑
  # 产品套件，方案 A）。纯 Node + git，无平台差异，只在 ubuntu 跑，与上方三平台矩阵并行。
  # 触发分级（2026-11-03）：job 常驻——test-workflow 是 main/develop 的 required check，
  # PR 合并需要它报告，整 job 跳过会让 PR 永远 pending；但仅当变更触达 .agents/** 或
  # test/orchestrator/** 才安装依赖跑套件，改 src/ 的日常推送只付 paths-filter 的 ~15s
  # 占位，不再每次白付 ~3min。
  workflow-suite:
    runs-on: ubuntu-latest
    name: test-workflow (orchestrator + guard hooks)
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # pull_request 事件经 API 列变更文件所需
    steps:
      # fetch-depth: 0：workflow_dispatch / schedule 事件下 paths-filter 需要完整历史算 diff
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agents:
              - '.agents/**'
              - 'test/orchestrator/**'
      # 无关变更必须 exit 0 占位（见上头注），setup-node / npm ci 一概不付
      - name: 变更未触达 .agents/**，跳过套件（占位绿）
        if: steps.filter.outputs.agents != 'true'
        run: echo '本次变更不涉及 .agents/** 或 test/orchestrator/**，工作流套件跳过'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.agents == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.filter.outputs.agents == 'true'
      - run: npm run test:workflow
        if: steps.filter.outputs.agents == 'true'
