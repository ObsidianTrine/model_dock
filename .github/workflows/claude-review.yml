name: claude-review

# PR 审查 bot：PR 打开/更新时自动出审查意见；在 PR/issue 评论里 @claude 可追问或要求改码。
#
# 启用前提：仓库 Settings → Secrets and variables → Actions 配置
#   ANTHROPIC_API_KEY —— Anthropic API key（bot 默认走 Anthropic 官方 API）
#   （想改走 Anthropic 兼容端点如智谱 GLM / 火山方舟：见 docs/ci-bots.md「换供应商」）
#   未配置时 bot 静默跳过（Actions 日志 warning），零 token 消耗。
#   设置与用途详见 docs/ci-bots.md。
#
# 边界：
#   - Dependabot 的 PR 不走本工作流（它触发的 run 拿到的 GITHUB_TOKEN 只读，发不了评论），
#     由 dependabot-fix.yml 专职处理。
#   - Claude 自己推的修复提交带 [dependabot-fix] 前缀，auto-review 检测到尾提交为该前缀时跳过，防审查回环。
#   - fork PR 拿不到 secrets，本工作流不覆盖（本仓库 PR 均来自同仓库分支）。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 同一 PR 的旧审查自动取消，省排队时间
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  auto-review:
    # PR 打开/更新 → 只读审查（不推代码，只发评论与 inline 标注）
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 未配置 API key 时静默跳过（未启用状态零消耗）
        id: keyguard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.ANTHROPIC_API_KEY，PR 审查 bot 未启用，本次跳过。启用方法见 docs/ci-bots.md。"
          fi
      - uses: actions/checkout@v7
        if: steps.keyguard.outputs.skip != 'true'
        with:
          fetch-depth: 1
      - name: 跳过 bot 自身修复提交（防审查回环）
        id: guard
        if: steps.keyguard.outputs.skip != 'true'
        run: |
          msg="$(git log -1 --pretty=%s)"
          echo "last commit subject: $msg"
          case "$msg" in
            "[dependabot-fix]"*) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: anthropics/claude-code-action@v1
        if: steps.keyguard.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            请审查这个 PR。项目背景：ModelDock = 本地模型配置托管中心 + API 网关（TypeScript ESM、
            Node ≥22、SEA 单文件打包）。完整约定以仓库根目录 AGENTS.md 为准，审查重点：

            1. 正确性：逻辑错误、边界条件、错误处理遗漏、资源泄漏（进程/句柄/端口）。
            2. 三平台兼容（Windows 是高频事故源）：路径必须 path.join()/path.resolve()（正则分隔符写 [\\/]）；
               权限/进程/换行的平台差异按 process.platform 显式分支；spawn 全局命令在 Windows 是 .cmd 包装。
            3. 项目硬约定：文件路径一律经 src/util/paths.ts（禁止硬编码 ~/.modeldock）；写盘走 atomicWrite()；
               用户可见文案经 src/util/i18n.ts 的 t() 且中英双语同写；不得引入 native addon；不得破坏 src/cli.ts 三路分发。
            4. 测试：vitest 隔离模型（同一模块被多文件 vi.mock、跨文件 clearAllMocks/restoreAllMocks 是雷）；
               测试禁止监听写死端口（8687 生产 / 8890 用户 dev 绝不允许出现在测试代码里）。
            5. 安全：密钥不落日志、网关凭据处理正确。

            要求：
            - 审查输出一律中文；只报有把握的真问题，每条标注 [P0]/[P1]/[P2]（P0=必须修，P1=应修，P2=建议）。
            - 具体代码问题用 mcp__github_inline_comment__create_inline_comment（confirmed: true）标注到行；
              总体结论用 gh pr comment 发一条顶层评论（优点一句话即可，重点列问题与建议）。
            - 只做只读审查：不要 Edit/Write 任何文件、不要 push。
            - 没有值得报告的问题时，顶层评论只写一句通过结论，不要凑数。
            - 注意：PR 分支已检出于当前工作目录。
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  interactive:
    # 评论 @claude → 交互会话：可追问，也可按评论指示修改代码（需要 contents: write 才能推送）
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: 未配置 API key 时静默跳过（未启用状态零消耗）
        id: keyguard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.ANTHROPIC_API_KEY，@claude 交互未启用，本次跳过。启用方法见 docs/ci-bots.md。"
          fi
      - uses: actions/checkout@v7
        if: steps.keyguard.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.keyguard.outputs.skip != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: develop
          claude_args: |
            --max-turns 60
